<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">📊 표준정규분포(Z)와 가설검정 양측 기각역 (α = 0.05)</text>
  
  <rect x="50" y="50" width="700" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 중심축 -->
  <line x1="100" y1="240" x2="700" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="240" x2="400" y2="80" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="400" y="260" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Z = 0 (μ)</text>

  <!-- 95% 채택역 영역 -->
  <path d="M243 240 C270 230 320 90 400 90 C480 90 530 230 557 240 Z" fill="#047857" fill-opacity="0.35"/>
  <!-- 좌 기각역 (2.5%) -->
  <path d="M120 240 C170 240 215 238 243 240 L243 240 Z" fill="#e11d48" fill-opacity="0.7"/>
  <!-- 우 기각역 (2.5%) -->
  <path d="M557 240 C585 238 630 240 680 240 Z" fill="#e11d48" fill-opacity="0.7"/>

  <!-- 정규분포 곡선 라인 -->
  <path d="M120 238 C180 238 220 232 250 205 C290 160 340 90 400 90 C460 90 510 160 550 205 C580 232 620 238 680 238" 
        fill="none" stroke="#34d399" stroke-width="3.5"/>

  <!-- 임계값 라인 Z = -1.96, +1.96 -->
  <line x1="250" y1="240" x2="250" y2="120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
  <line x1="550" y1="240" x2="550" y2="120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
  <text x="250" y="260" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">Z = -1.96</text>
  <text x="550" y="260" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">Z = +1.96</text>

  <!-- 채택역 95% 라벨 -->
  <text x="400" y="150" fill="#6ee7b7" font-size="16" font-weight="bold" text-anchor="middle">귀무가설 채택역 (95%)</text>
  <text x="400" y="172" fill="#a7f3d0" font-size="12" text-anchor="middle">p ≥ 0.05 : 통계적으로 유의한 차이 없음</text>

  <!-- 좌우 기각역 라벨 -->
  <text x="180" y="195" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">기각역 (α/2 = 0.025)</text>
  <text x="620" y="195" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">기각역 (α/2 = 0.025)</text>
  <text x="620" y="215" fill="#fda4af" font-size="10" text-anchor="middle">p &lt; 0.05 (* 유의한 차이)</text>
</svg>