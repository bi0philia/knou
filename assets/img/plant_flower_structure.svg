<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🌸 완전화(Complete Flower)의 4대 기본 구조</text>
  
  <!-- 배경 카드 -->
  <rect x="50" y="55" width="700" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 꽃 다이어그램 중심부 -->
  <g transform="translate(400, 260)">
    <!-- 화경 (꽃자루) -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <!-- 화탁 (꽃턱) -->
    <ellipse cx="0" cy="0" rx="35" ry="15" fill="#334155" stroke="#64748b" stroke-width="2"/>
    
    <!-- 꽃받침 (Calyx / Sepal) -->
    <path d="M-30 0 C-60 -20 -70 -40 -80 -50 C-65 -45 -40 -20 -20 0" fill="#15803d" stroke="#16a34a" stroke-width="2"/>
    <path d="M30 0 C60 -20 70 -40 80 -50 C65 -45 40 -20 20 0" fill="#15803d" stroke="#16a34a" stroke-width="2"/>
    
    <!-- 꽃잎 (Corolla / Petal) -->
    <path d="M-20 -5 C-120 -60 -150 -140 -120 -180 C-70 -160 -50 -100 -10 -15" fill="#f43f5e" fill-opacity="0.85" stroke="#fb7185" stroke-width="2"/>
    <path d="M20 -5 C120 -60 150 -140 120 -180 C70 -160 50 -100 10 -15" fill="#f43f5e" fill-opacity="0.85" stroke="#fb7185" stroke-width="2"/>
    <path d="M0 -15 C-40 -120 -20 -190 0 -200 C20 -190 40 -120 0 -15" fill="#fb7185" fill-opacity="0.7" stroke="#fda4af" stroke-width="2"/>

    <!-- 수술 (Stamen) 좌우 -->
    <!-- 좌 수술 -->
    <path d="M-15 -10 Q-60 -90 -50 -140" fill="none" stroke="#fef08a" stroke-width="3"/>
    <ellipse cx="-50" cy="-145" rx="9" ry="6" fill="#eab308" stroke="#facc15" stroke-width="2"/>
    <!-- 우 수술 -->
    <path d="M15 -10 Q60 -90 50 -140" fill="none" stroke="#fef08a" stroke-width="3"/>
    <ellipse cx="50" cy="-145" rx="9" ry="6" fill="#eab308" stroke="#facc15" stroke-width="2"/>

    <!-- 암술 (Pistil) 중심 -->
    <!-- 씨방 (자방 Ovary) -->
    <ellipse cx="0" cy="-35" rx="25" ry="30" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <!-- 배주 (밑씨 Ovule) -->
    <circle cx="-8" cy="-35" r="5" fill="#fef08a"/>
    <circle cx="8" cy="-35" r="5" fill="#fef08a"/>
    <!-- 암술대 (화주 Style) -->
    <line x1="0" y1="-65" x2="0" y2="-155" stroke="#10b981" stroke-width="6"/>
    <!-- 암술머리 (주두 Stigma) -->
    <ellipse cx="0" cy="-160" rx="14" ry="7" fill="#059669" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- 좌측 설명 박스: 암술 &amp; 꽃잎 -->
  <g transform="translate(80, 85)">
    <!-- 암술 주석 -->
    <rect width="180" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="24" fill="#34d399" font-size="13" font-weight="bold">♀ 암술 (Pistil / Gynoecium)</text>
    <text x="15" y="44" fill="#94a3b8" font-size="11">• 주두(암술머리): 수분 장소</text>
    <text x="15" y="62" fill="#94a3b8" font-size="11">• 화주(암술대) + 자방(씨방)</text>
    <line x1="180" y1="35" x2="380" y2="105" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>

    <!-- 꽃잎 주석 -->
    <rect y="100" width="180" height="60" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="15" y="124" fill="#fb7185" font-size="13" font-weight="bold">🌸 화관 / 꽃잎 (Petal)</text>
    <text x="15" y="144" fill="#94a3b8" font-size="11">• 방화 곤충 유인, 생식기관 보호</text>
    <line x1="180" y1="130" x2="300" y2="150" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3"/>
  </g>

  <!-- 우측 설명 박스: 수술 &amp; 꽃받침 -->
  <g transform="translate(540, 85)">
    <!-- 수술 주석 -->
    <rect width="180" height="75" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <text x="15" y="24" fill="#facc15" font-size="13" font-weight="bold">♂ 수술 (Stamen / Androecium)</text>
    <text x="15" y="44" fill="#94a3b8" font-size="11">• 약(꽃밥): 화분(꽃가루) 생성</text>
    <text x="15" y="62" fill="#94a3b8" font-size="11">• 화사(수술대): 약을 지지</text>
    <line x1="0" y1="35" x2="-90" y2="115" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3"/>

    <!-- 꽃받침 주석 -->
    <rect y="100" width="180" height="60" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="1.5"/>
    <text x="15" y="124" fill="#4ade80" font-size="13" font-weight="bold">🍃 꽃받침 (Sepal / Calyx)</text>
    <text x="15" y="144" fill="#94a3b8" font-size="11">• 꽃봉오리 시기 화부 전체 보호</text>
    <line x1="0" y1="130" x2="-70" y2="210" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3"/>
  </g>
</svg>