<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🔄 고도 하수처리(A₂/O): 질소 제거 내부반송 &amp; 인 과잉섭취(EBPR)</text>
  
  <rect x="40" y="45" width="720" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 3단 반응조: 혐기조 -> 무산소조 -> 호기조 -->
  <!-- 1. 혐기조 (Anaerobic) -->
  <g transform="translate(70, 80)">
    <rect width="180" height="150" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="26" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">1. 혐기조 (Anaerobic)</text>
    <text x="90" y="44" fill="#fed7aa" font-size="11" text-anchor="middle">DO = 0, NO₃⁻ = 0</text>
    <rect x="15" y="60" width="150" height="75" rx="6" fill="#1e293b"/>
    <text x="90" y="80" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">★ 인(P) 방출 (Release)</text>
    <text x="90" y="100" fill="#f8fafc" font-size="10" text-anchor="middle">PAO가 Poly-P를 분해하여</text>
    <text x="90" y="118" fill="#f8fafc" font-size="10" text-anchor="middle">VFA를 PHA로 체내 저장</text>
  </g>

  <!-- 2. 무산소조 (Anoxic) -->
  <g transform="translate(290, 80)">
    <rect width="190" height="150" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="26" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">2. 무산소조 (Anoxic)</text>
    <text x="95" y="44" fill="#bae6fd" font-size="11" text-anchor="middle">DO = 0, NO₃⁻ 유입</text>
    <rect x="15" y="60" width="160" height="75" rx="6" fill="#1e293b"/>
    <text x="95" y="80" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">★ 탈질화 (Denitrification)</text>
    <text x="95" y="100" fill="#f8fafc" font-size="10" text-anchor="middle">탈질균이 NO₃⁻를 전자수용체로</text>
    <text x="95" y="118" fill="#f8fafc" font-size="10" text-anchor="middle">소비하여 N₂ 가스로 대기 방출</text>
  </g>

  <!-- 3. 호기조 (Oxic / Aerobic) -->
  <g transform="translate(520, 80)">
    <rect width="200" height="150" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="26" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">3. 호기조 (Oxic / 폭기조)</text>
    <text x="100" y="44" fill="#a7f3d0" font-size="11" text-anchor="middle">DO 충분 (산소 폭기)</text>
    <rect x="15" y="60" width="170" height="75" rx="6" fill="#1e293b"/>
    <text x="100" y="78" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">① 질산화: NH₄⁺ → NO₃⁻</text>
    <text x="100" y="98" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="middle">② 인 과잉섭취 (Luxury uptake)</text>
    <text x="100" y="118" fill="#f8fafc" font-size="10" text-anchor="middle">방출량의 2~3배 인 흡수</text>
  </g>

  <!-- 내부 반송 루프 (호기조 -> 무산소조 100~300%) -->
  <g transform="translate(385, 240)">
    <path d="M230 0 L230 30 L0 30 L0 5" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4"/>
    <polygon points="0,0 -5,10 5,10" fill="#f43f5e"/>
    <rect x="40" y="18" width="160" height="22" rx="4" fill="#0f172a" stroke="#f43f5e"/>
    <text x="120" y="33" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="middle">★ 질산화액 내부반송 (100~300%)</text>
  </g>

  <!-- 하단 요약 -->
  <text x="400" y="300" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">질소 제거: 호기조 질산화액을 무산소조로 역류시켜 탈질화 / 인 제거: 혐기조 방출 후 호기조 과잉섭취 슬러지 폐기</text>
</svg>