<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">💧 물(H₂O)의 상평형도와 융해곡선 음(-)의 기울기 특이성</text>
  
  <rect x="50" y="50" width="700" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 축 -->
  <line x1="120" y1="260" x2="680" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="260" x2="120" y2="70" stroke="#64748b" stroke-width="2"/>
  <text x="685" y="264" fill="#94a3b8" font-size="11">온도 T (°C)</text>
  <text x="120" y="60" fill="#94a3b8" font-size="11" text-anchor="middle">압력 P (atm)</text>

  <!-- 삼중점 좌표 표시 -->
  <line x1="120" y1="180" x2="280" y2="180" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
  <line x1="280" y1="180" x2="280" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
  <text x="110" y="184" fill="#facc15" font-size="10" text-anchor="end">0.006 atm</text>
  <text x="280" y="275" fill="#facc15" font-size="10" text-anchor="middle">0.01 °C</text>

  <!-- 1기압 표준점 -->
  <line x1="120" y1="110" x2="450" y2="110" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
  <text x="110" y="114" fill="#94a3b8" font-size="10" text-anchor="end">1.0 atm</text>
  <line x1="265" y1="110" x2="265" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="2"/>
  <text x="265" y="275" fill="#38bdf8" font-size="10" text-anchor="middle">0 °C</text>
  <line x1="500" y1="110" x2="500" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="2"/>
  <text x="500" y="275" fill="#f43f5e" font-size="10" text-anchor="middle">100 °C</text>

  <!-- 상경계선들 -->
  <!-- 1. 승화곡선 (고체-기체) -->
  <path d="M120 250 Q200 240 280 180" fill="none" stroke="#60a5fa" stroke-width="3"/>
  
  <!-- 2. 기화곡선 (액체-기체) -->
  <path d="M280 180 Q380 140 600 80" fill="none" stroke="#f43f5e" stroke-width="3"/>

  <!-- 3. 융해곡선 (고체-액체: 음의 기울기! 좌상향) -->
  <path d="M280 180 L250 80" fill="none" stroke="#34d399" stroke-width="4"/>

  <!-- 삼중점 마커 -->
  <circle cx="280" cy="180" r="5" fill="#facc15" stroke="#fff" stroke-width="1.5"/>

  <!-- 상 영역 레이블 -->
  <text x="190" y="130" fill="#93c5fd" font-size="18" font-weight="bold" text-anchor="middle">고체 (얼음)</text>
  <text x="370" y="100" fill="#6ee7b7" font-size="18" font-weight="bold" text-anchor="middle">액체 (물)</text>
  <text x="480" y="210" fill="#fca5a5" font-size="18" font-weight="bold" text-anchor="middle">기체 (수증기)</text>

  <!-- 핵심 포인트 콜아웃 -->
  <g transform="translate(480, 70)">
    <rect width="250" height="90" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="15" y="24" fill="#34d399" font-size="12" font-weight="bold">★ 융해곡선 음(-)의 기울기 원리</text>
    <text x="15" y="44" fill="#f8fafc" font-size="11">• 얼음의 밀도 &lt; 물의 밀도 (부피 팽창)</text>
    <text x="15" y="62" fill="#f8fafc" font-size="11">• 압력을 가하면 어는점이 낮아져 녹음</text>
    <text x="15" y="80" fill="#facc15" font-size="11">• 스케이트 날 압력으로 얼음이 물로 변함</text>
  </g>
</svg>