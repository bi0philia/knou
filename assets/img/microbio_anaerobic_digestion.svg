<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🔥 혐기성 소화(Anaerobic Digestion) 4단계 반응 경로</text>
  
  <rect x="40" y="45" width="720" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 4단계 카드 나열 -->
  <!-- 1. 가수분해 -->
  <g transform="translate(60, 65)">
    <rect width="150" height="175" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">1단계: 가수분해</text>
    <text x="75" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">(Hydrolysis)</text>
    <rect x="15" y="55" width="120" height="40" rx="4" fill="#1e293b"/>
    <text x="75" y="72" fill="#f8fafc" font-size="10" text-anchor="middle">불용성 고분자</text>
    <text x="75" y="86" fill="#94a3b8" font-size="9" text-anchor="middle">(탄수화물,단백질,지방)</text>
    <text x="75" y="112" fill="#38bdf8" font-size="14" text-anchor="middle">↓</text>
    <text x="75" y="130" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">가용성 단량체</text>
    <text x="75" y="145" fill="#facc15" font-size="9" font-weight="bold" text-anchor="middle">★ 속도제한단계</text>
  </g>

  <!-- 화살표 1->2 -->
  <path d="M220 150 L240 150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2. 산생성 -->
  <g transform="translate(245, 65)">
    <rect width="150" height="175" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="75" y="24" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">2단계: 산생성</text>
    <text x="75" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">(Acidogenesis)</text>
    <rect x="15" y="55" width="120" height="40" rx="4" fill="#1e293b"/>
    <text x="75" y="72" fill="#f8fafc" font-size="10" text-anchor="middle">단량체 발효 분해</text>
    <text x="75" y="86" fill="#94a3b8" font-size="9" text-anchor="middle">(발효세균군)</text>
    <text x="75" y="112" fill="#fbbf24" font-size="14" text-anchor="middle">↓</text>
    <text x="75" y="130" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">휘발성 지방산(VFA)</text>
    <text x="75" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">프로피온산, 뷰티르산</text>
  </g>

  <!-- 화살표 2->3 -->
  <path d="M405 150 L425 150" stroke="#64748b" stroke-width="3"/>

  <!-- 3. 아세트산생성 -->
  <g transform="translate(430, 65)">
    <rect width="150" height="175" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="24" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">3단계: 초산생성</text>
    <text x="75" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">(Acetogenesis)</text>
    <rect x="15" y="55" width="120" height="40" rx="4" fill="#1e293b"/>
    <text x="75" y="72" fill="#f8fafc" font-size="10" text-anchor="middle">VFA의 추가 산화</text>
    <text x="75" y="86" fill="#94a3b8" font-size="9" text-anchor="middle">(수소생성초산균)</text>
    <text x="75" y="112" fill="#fb7185" font-size="14" text-anchor="middle">↓</text>
    <text x="75" y="130" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">아세트산 + H₂ + CO₂</text>
    <text x="75" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">메탄 기질 완성</text>
  </g>

  <!-- 화살표 3->4 -->
  <path d="M590 150 L610 150" stroke="#64748b" stroke-width="3"/>

  <!-- 4. 메탄생성 -->
  <g transform="translate(615, 65)">
    <rect width="135" height="175" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="67" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">4단계: 메탄생성</text>
    <text x="67" y="40" fill="#a7f3d0" font-size="10" text-anchor="middle">(Methanogenesis)</text>
    <rect x="10" y="55" width="115" height="45" rx="4" fill="#0f172a"/>
    <text x="67" y="72" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">① 초산 분계형 (70%)</text>
    <text x="67" y="90" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">② 수소 이용형 (30%)</text>
    <text x="67" y="118" fill="#10b981" font-size="14" text-anchor="middle">↓</text>
    <text x="67" y="136" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">바이오가스</text>
    <text x="67" y="152" fill="#fef08a" font-size="10" text-anchor="middle">CH₄ 65% + CO₂ 35%</text>
  </g>

  <!-- 하단 운전 주의점 -->
  <text x="400" y="270" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">⚠️ 메탄고세균 주의: 절대혐기성, 최적 pH 6.8~7.2. VFA 축적 시 산패(Sour digester) 발생 → 중탄산염 알칼리도 유지 필수!</text>
</svg>