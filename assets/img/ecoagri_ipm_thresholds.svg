<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🎯 종합적 병해충 관리(IPM): 경제적 피해수준(EIL) vs 요방제수준(ET)</text>
  
  <rect x="50" y="45" width="700" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 축 -->
  <line x1="120" y1="240" x2="680" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="240" x2="120" y2="70" stroke="#64748b" stroke-width="2"/>
  <text x="685" y="244" fill="#94a3b8" font-size="11">시간 (Time)</text>
  <text x="120" y="60" fill="#94a3b8" font-size="11" text-anchor="middle">해충 밀도 (Density)</text>

  <!-- 1. 경제적 피해한계선 (EIL) 상단 적색선 -->
  <line x1="120" y1="100" x2="680" y2="100" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5"/>
  <text x="130" y="92" fill="#fb7185" font-size="12" font-weight="bold">경제적 피해한계선 (EIL, Economic Injury Level) - 손실 발생 최저 밀도</text>

  <!-- 2. 요방제수준 (ET) 중간 황색선 -->
  <line x1="120" y1="150" x2="680" y2="150" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4"/>
  <text x="130" y="142" fill="#facc15" font-size="12" font-weight="bold">★ 요방제수준 (ET, Economic Threshold) - 실제 방제 조치를 개시하는 밀도 (ET &lt; EIL)</text>

  <!-- 3. 일반 평형 밀도 (GEP) 하단 녹색선 -->
  <line x1="120" y1="205" x2="680" y2="205" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2"/>
  <text x="130" y="200" fill="#34d399" font-size="11">일반 평형 밀도 (GEP, General Equilibrium Position)</text>

  <!-- 해충 밀도 변동 곡선 및 방제 효과 -->
  <path d="M120 205 Q220 200 280 180 T360 150 Q390 145 420 115" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <!-- ET 도달 지점에서 방제 투입 -->
  <circle cx="360" cy="150" r="6" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <text x="360" y="172" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">방제 개시!</text>

  <!-- 방제 후 밀도 급감 곡선 -->
  <path d="M360 150 C380 150 400 230 460 215 T560 205 T680 205" fill="none" stroke="#34d399" stroke-width="3"/>

  <!-- 핵심 요약 -->
  <g transform="translate(480, 75)">
    <rect width="250" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="125" y="22" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">★ 방제 원칙: ET &lt; EIL</text>
    <text x="125" y="42" fill="#f8fafc" font-size="10" text-anchor="middle">해충 밀도가 EIL에 도달하기 전인</text>
    <text x="125" y="54" fill="#a7f3d0" font-size="10" text-anchor="middle">ET 단계에서 선제적 친환경 방제 개시!</text>
  </g>
</svg>