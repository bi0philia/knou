<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🔍 수술군(雄蕊群, Androecium)의 5대 특수 형태 식별키</text>
  
  <!-- 1. 사강웅예 (십자화과) -->
  <g transform="translate(30, 55)">
    <rect width="135" height="245" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="67" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">사강웅예 (四强)</text>
    <text x="67" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">수술 6개 중 4장2단</text>
    <!-- 다이어그램 -->
    <g transform="translate(67, 130)">
      <!-- 외측 짧은 2개 -->
      <line x1="-35" y1="40" x2="-35" y2="0" stroke="#fef08a" stroke-width="2.5"/><circle cx="-35" cy="-3" r="4.5" fill="#eab308"/>
      <line x1="35" y1="40" x2="35" y2="0" stroke="#fef08a" stroke-width="2.5"/><circle cx="35" cy="-3" r="4.5" fill="#eab308"/>
      <!-- 내측 긴 4개 -->
      <line x1="-18" y1="40" x2="-18" y2="-35" stroke="#fef08a" stroke-width="2.5"/><circle cx="-18" cy="-38" r="4.5" fill="#facc15"/>
      <line x1="-6" y1="40" x2="-6" y2="-38" stroke="#fef08a" stroke-width="2.5"/><circle cx="-6" cy="-41" r="4.5" fill="#facc15"/>
      <line x1="6" y1="40" x2="6" y2="-38" stroke="#fef08a" stroke-width="2.5"/><circle cx="6" cy="-41" r="4.5" fill="#facc15"/>
      <line x1="18" y1="40" x2="18" y2="-35" stroke="#fef08a" stroke-width="2.5"/><circle cx="18" cy="-38" r="4.5" fill="#facc15"/>
      <!-- 중심 암술 -->
      <ellipse cx="0" cy="20" rx="8" ry="15" fill="#065f46"/>
      <line x1="0" y1="5" x2="0" y2="-20" stroke="#10b981" stroke-width="3"/><circle cx="0" cy="-22" r="3" fill="#34d399"/>
    </g>
    <text x="67" y="215" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">십자화과 (배추과)</text>
    <text x="67" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">배추, 무, 유채, 냉이</text>
  </g>

  <!-- 2. 이강웅예 (꿀풀과) -->
  <g transform="translate(180, 55)">
    <rect width="135" height="245" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="67" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">이강웅예 (二强)</text>
    <text x="67" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">수술 4개 중 2장2단</text>
    <!-- 다이어그램 -->
    <g transform="translate(67, 130)">
      <!-- 짧은 2개 -->
      <line x1="-25" y1="40" x2="-25" y2="0" stroke="#fef08a" stroke-width="2.5"/><circle cx="-25" cy="-3" r="4.5" fill="#eab308"/>
      <line x1="25" y1="40" x2="25" y2="0" stroke="#fef08a" stroke-width="2.5"/><circle cx="25" cy="-3" r="4.5" fill="#eab308"/>
      <!-- 긴 2개 -->
      <line x1="-10" y1="40" x2="-10" y2="-35" stroke="#fef08a" stroke-width="2.5"/><circle cx="-10" cy="-38" r="4.5" fill="#facc15"/>
      <line x1="10" y1="40" x2="10" y2="-35" stroke="#fef08a" stroke-width="2.5"/><circle cx="10" cy="-38" r="4.5" fill="#facc15"/>
      <!-- 중심 암술 -->
      <ellipse cx="0" cy="20" rx="8" ry="15" fill="#0369a1"/>
      <line x1="0" y1="5" x2="0" y2="-20" stroke="#38bdf8" stroke-width="3"/><circle cx="0" cy="-22" r="3" fill="#7dd3fc"/>
    </g>
    <text x="67" y="215" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">꿀풀과, 현삼과</text>
    <text x="67" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">들깨, 배초향, 박하</text>
  </g>

  <!-- 3. 양체웅예 (콩과) -->
  <g transform="translate(330, 55)">
    <rect width="135" height="245" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="67" y="24" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">양체웅예 (兩體)</text>
    <text x="67" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">10개 수술 중 (9+1)</text>
    <g transform="translate(67, 130)">
      <!-- 9개 융합 통 -->
      <path d="M-20 40 C-25 10 -25 -20 -15 -30 C0 -25 15 -25 20 40 Z" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="-18" cy="-33" r="3.5" fill="#facc15"/><circle cx="-9" cy="-35" r="3.5" fill="#facc15"/><circle cx="0" cy="-36" r="3.5" fill="#facc15"/><circle cx="9" cy="-35" r="3.5" fill="#facc15"/><circle cx="18" cy="-33" r="3.5" fill="#facc15"/>
      <!-- 분리된 1개 수술 -->
      <line x1="30" y1="40" x2="30" y2="-30" stroke="#f43f5e" stroke-width="2.5"/><circle cx="30" cy="-33" r="4" fill="#f43f5e"/>
    </g>
    <text x="67" y="215" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">콩과 (Fabaceae)</text>
    <text x="67" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">콩, 팥, 아까시나무</text>
  </g>

  <!-- 4. 단체웅예 (아욱과) -->
  <g transform="translate(480, 55)">
    <rect width="135" height="245" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="67" y="24" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">단체웅예 (單體)</text>
    <text x="67" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">수술대 전체 하나로 융합</text>
    <g transform="translate(67, 130)">
      <!-- 원통형 수술대 융합 통 -->
      <rect x="-12" y="-15" width="24" height="55" rx="10" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
      <!-- 사방으로 갈라지는 꽃밥들 -->
      <circle cx="-20" cy="-10" r="3.5" fill="#facc15"/><circle cx="20" cy="-10" r="3.5" fill="#facc15"/>
      <circle cx="-22" cy="5" r="3.5" fill="#facc15"/><circle cx="22" cy="5" r="3.5" fill="#facc15"/>
      <circle cx="-20" cy="20" r="3.5" fill="#facc15"/><circle cx="20" cy="20" r="3.5" fill="#facc15"/>
      <!-- 끝으로 뻗어나온 암술머리 -->
      <line x1="0" y1="-15" x2="0" y2="-38" stroke="#fb7185" stroke-width="3"/>
      <circle cx="-5" cy="-40" r="2.5" fill="#fda4af"/><circle cx="0" cy="-42" r="2.5" fill="#fda4af"/><circle cx="5" cy="-40" r="2.5" fill="#fda4af"/>
    </g>
    <text x="67" y="215" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">아욱과 (무궁화)</text>
    <text x="67" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">무궁화, 목화, 접시꽃</text>
  </g>

  <!-- 5. 집약웅예 (국화과) -->
  <g transform="translate(630, 55)">
    <rect width="140" height="245" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="24" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">집약웅예 (集葯)</text>
    <text x="70" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">수술대 분리, 꽃밥 결합</text>
    <g transform="translate(70, 130)">
      <!-- 하부 분리된 수술대 5개 -->
      <line x1="-15" y1="40" x2="-12" y2="5" stroke="#fef08a" stroke-width="2"/>
      <line x1="-5" y1="40" x2="-4" y2="5" stroke="#fef08a" stroke-width="2"/>
      <line x1="5" y1="40" x2="4" y2="5" stroke="#fef08a" stroke-width="2"/>
      <line x1="15" y1="40" x2="12" y2="5" stroke="#fef08a" stroke-width="2"/>
      <!-- 상부 결합된 원통형 약(꽃밥) -->
      <rect x="-16" y="-30" width="32" height="35" rx="4" fill="#6b21a8" stroke="#a855f7" stroke-width="2"/>
      <text x="0" y="-10" fill="#f3e8ff" font-size="9" font-weight="bold" text-anchor="middle">약 결합</text>
      <!-- 약통을 뚫고 나온 2갈래 암술머리 -->
      <line x1="0" y1="-30" x2="0" y2="-45" stroke="#34d399" stroke-width="2.5"/>
      <path d="M0 -45 Q-10 -55 -12 -45" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M0 -45 Q10 -55 12 -45" fill="none" stroke="#34d399" stroke-width="2"/>
    </g>
    <text x="70" y="215" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">국화과 (Asteraceae)</text>
    <text x="70" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">민들레, 해바라기, 쑥</text>
  </g>
</svg>