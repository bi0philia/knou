<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🔬 그람 염색법(Gram Stain) 세포벽 구조와 판별 원리</text>
  
  <!-- 그람양성균 (좌) -->
  <g transform="translate(60, 50)">
    <rect width="320" height="250" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="160" y="30" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">그람양성균 (Gram-Positive)</text>
    <rect x="110" y="40" width="100" height="22" rx="6" fill="#7e22ce" stroke="#a855f7"/>
    <text x="160" y="55" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">보라색 / 자주색</text>
    
    <!-- 펩티도글리칸 두꺼운 층 -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="260" height="65" rx="6" fill="#581c87" stroke="#a855f7" stroke-width="1.5"/>
      <text x="130" y="30" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">두꺼운 펩티도글리칸 층 (90%)</text>
      <text x="130" y="48" fill="#d8b4fe" font-size="10" text-anchor="middle">+ 테이코산(Teichoic acid) 함유</text>
      
      <!-- 세포막 -->
      <rect x="0" y="80" width="260" height="25" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="130" y="97" fill="#e0f2fe" font-size="11" text-anchor="middle">인지질 2중층 세포막 (에스터 결합)</text>
    </g>

    <text x="160" y="210" fill="#94a3b8" font-size="11" text-anchor="middle">• 알코올 탈색 시 탈수로 기공 수축</text>
    <text x="160" y="226" fill="#f3e8ff" font-size="11" font-weight="bold" text-anchor="middle">• 크리스탈 바이올렛 염료 유지 (보라색)</text>
    <text x="160" y="242" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">대표: Bacillus, Clostridium, 방선균</text>
  </g>

  <!-- 그람음성균 (우) -->
  <g transform="translate(420, 50)">
    <rect width="320" height="250" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="30" fill="#fb7185" font-size="16" font-weight="bold" text-anchor="middle">그람음성균 (Gram-Negative)</text>
    <rect x="110" y="40" width="100" height="22" rx="6" fill="#be123c" stroke="#f43f5e"/>
    <text x="160" y="55" fill="#ffe4e6" font-size="12" font-weight="bold" text-anchor="middle">적색 / 분홍색</text>
    
    <!-- 외막 + 얇은 펩티도글리칸 -->
    <g transform="translate(30, 75)">
      <!-- 외막 (LPS) -->
      <rect x="0" y="0" width="260" height="25" rx="4" fill="#9f1239" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="130" y="17" fill="#ffe4e6" font-size="11" font-weight="bold" text-anchor="middle">외막 (Outer Membrane) + LPS 내독소</text>

      <!-- 얇은 펩티도글리칸 -->
      <rect x="0" y="35" width="260" height="20" rx="3" fill="#581c87" stroke="#a855f7" stroke-width="1"/>
      <text x="130" y="49" fill="#f3e8ff" font-size="10" text-anchor="middle">얇은 펩티도글리칸 (10%)</text>
      
      <!-- 세포막 -->
      <rect x="0" y="65" width="260" height="25" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="130" y="82" fill="#e0f2fe" font-size="11" text-anchor="middle">인지질 2중층 세포막 (에스터 결합)</text>
    </g>

    <text x="160" y="210" fill="#94a3b8" font-size="11" text-anchor="middle">• 알코올에 외막 지질 용해 $ightarrow$ 염료 탈색</text>
    <text x="160" y="226" fill="#ffe4e6" font-size="11" font-weight="bold" text-anchor="middle">• 사프라닌 대조염색 시 적색(분홍색)</text>
    <text x="160" y="242" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="middle">대표: E. coli, 활성슬러지 수처리 세균 대다수</text>
  </g>
</svg>