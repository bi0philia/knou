<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">🌼 주요 화서(花序, Inflorescence, 꽃차례) 핵심 유형 비교</text>
  
  <!-- 상단 4종: 무한화서 (총상, 수상, 산방, 산형) -->
  <!-- 1. 총상화서 -->
  <g transform="translate(40, 50)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">총상화서 (Raceme)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">꽃자루 길이 균일, 하→상</text>
    <line x1="82" y1="50" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 꽃자루와 꽃 -->
    <line x1="82" y1="115" x2="55" y2="105" stroke="#64748b" stroke-width="1.5"/><circle cx="55" cy="105" r="5" fill="#f43f5e"/>
    <line x1="82" y1="110" x2="110" y2="100" stroke="#64748b" stroke-width="1.5"/><circle cx="110" cy="100" r="5" fill="#f43f5e"/>
    <line x1="82" y1="90" x2="60" y2="80" stroke="#64748b" stroke-width="1.5"/><circle cx="60" cy="80" r="4.5" fill="#fb7185"/>
    <line x1="82" y1="85" x2="105" y2="75" stroke="#64748b" stroke-width="1.5"/><circle cx="105" cy="75" r="4.5" fill="#fb7185"/>
    <line x1="82" y1="65" x2="70" y2="60" stroke="#64748b" stroke-width="1.5"/><circle cx="70" cy="60" r="3.5" fill="#fbcfe8"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">유채, 무, 아까시나무</text>
  </g>

  <!-- 2. 수상화서 -->
  <g transform="translate(225, 50)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">수상화서 (Spike)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">꽃자루 없음 (직접 부착)</text>
    <line x1="82" y1="50" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <circle cx="75" cy="115" r="5" fill="#38bdf8"/>
    <circle cx="89" cy="110" r="5" fill="#38bdf8"/>
    <circle cx="75" cy="95" r="4.5" fill="#7dd3fc"/>
    <circle cx="89" cy="90" r="4.5" fill="#7dd3fc"/>
    <circle cx="76" cy="75" r="4" fill="#bae6fd"/>
    <circle cx="88" cy="70" r="4" fill="#bae6fd"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">질경이, 보리, 여뀌</text>
  </g>

  <!-- 3. 산방화서 -->
  <g transform="translate(410, 50)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">산방화서 (Corymb)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">하부 자루 길어 평면 정렬</text>
    <line x1="82" y1="70" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 하부 자루 길게 -->
    <line x1="82" y1="120" x2="40" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="40" cy="65" r="5" fill="#fbbf24"/>
    <line x1="82" y1="120" x2="124" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="124" cy="65" r="5" fill="#fbbf24"/>
    <line x1="82" y1="100" x2="60" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="60" cy="65" r="5" fill="#fbbf24"/>
    <line x1="82" y1="100" x2="104" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="104" cy="65" r="5" fill="#fbbf24"/>
    <line x1="82" y1="80" x2="82" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="82" cy="65" r="5" fill="#fde68a"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">조팝나무, 마가목, 배나무</text>
  </g>

  <!-- 4. 산형화서 -->
  <g transform="translate(595, 50)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#a78bfa" font-size="13" font-weight="bold" text-anchor="middle">산형화서 (Umbel)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">한 점에서 우산살 방사</text>
    <line x1="82" y1="100" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <line x1="82" y1="100" x2="35" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="35" cy="65" r="5" fill="#a78bfa"/>
    <line x1="82" y1="100" x2="58" y2="60" stroke="#64748b" stroke-width="1.5"/><circle cx="58" cy="60" r="5" fill="#a78bfa"/>
    <line x1="82" y1="100" x2="82" y2="58" stroke="#64748b" stroke-width="1.5"/><circle cx="82" cy="58" r="5" fill="#c4b5fd"/>
    <line x1="82" y1="100" x2="106" y2="60" stroke="#64748b" stroke-width="1.5"/><circle cx="106" cy="60" r="5" fill="#a78bfa"/>
    <line x1="82" y1="100" x2="129" y2="65" stroke="#64748b" stroke-width="1.5"/><circle cx="129" cy="65" r="5" fill="#a78bfa"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">미나리과(당근), 양파, 파</text>
  </g>

  <!-- 하단 4종: 두상, 원추, 육수, 취산 -->
  <!-- 5. 두상화서 -->
  <g transform="translate(40, 210)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">두상화서 (Head/Capitulum)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">화탁 위 무수한 무경두화</text>
    <line x1="82" y1="110" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 편평 화탁 -->
    <ellipse cx="82" cy="105" rx="45" ry="10" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- 통상화 / 설상화 무리 -->
    <ellipse cx="82" cy="98" rx="35" ry="8" fill="#fbbf24"/>
    <circle cx="50" cy="96" r="3.5" fill="#f59e0b"/><circle cx="62" cy="94" r="3.5" fill="#f59e0b"/><circle cx="74" cy="93" r="3.5" fill="#f59e0b"/>
    <circle cx="86" cy="93" r="3.5" fill="#f59e0b"/><circle cx="98" cy="94" r="3.5" fill="#f59e0b"/><circle cx="110" cy="96" r="3.5" fill="#f59e0b"/>
    <!-- 외곽 설상화 -->
    <path d="M45 98 C30 90 20 85 20 75 C32 82 40 92 45 98" fill="#facc15"/>
    <path d="M119 98 C134 90 144 85 144 75 C132 82 124 92 119 98" fill="#facc15"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">국화과 (민들레, 해바라기)</text>
  </g>

  <!-- 6. 원추화서 -->
  <g transform="translate(225, 210)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">원추화서 (Panicle)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">총상화서 복합 분지 (피라미드)</text>
    <line x1="82" y1="50" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 1단 가지 -->
    <line x1="82" y1="110" x2="45" y2="90" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="45" cy="90" r="3.5" fill="#34d399"/><circle cx="55" cy="85" r="3.5" fill="#34d399"/>
    <line x1="82" y1="110" x2="119" y2="90" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="119" cy="90" r="3.5" fill="#34d399"/><circle cx="109" cy="85" r="3.5" fill="#34d399"/>
    <!-- 2단 가지 -->
    <line x1="82" y1="85" x2="55" y2="70" stroke="#64748b" stroke-width="1.5"/><circle cx="55" cy="70" r="3.5" fill="#6ee7b7"/>
    <line x1="82" y1="85" x2="109" y2="70" stroke="#64748b" stroke-width="1.5"/><circle cx="109" cy="70" r="3.5" fill="#6ee7b7"/>
    <!-- 정단 -->
    <circle cx="82" cy="50" r="4" fill="#a7f3d0"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">벼, 옥수수(수꽃), 귀리</text>
  </g>

  <!-- 7. 육수화서 -->
  <g transform="translate(410, 210)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">육수화서 (Spadix)</text>
    <text x="82" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">육질 원주 꽃대 + 불염포</text>
    <line x1="82" y1="105" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 불염포 (Spathe) -->
    <path d="M70 110 C50 90 40 50 65 50 C95 50 120 70 120 110" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- 육질 원주 꽃대 -->
    <rect x="76" y="55" width="12" height="55" rx="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">천남성과 (토란, 카라, 창포)</text>
  </g>

  <!-- 8. 취산화서 (유한화서) -->
  <g transform="translate(595, 210)">
    <rect width="165" height="145" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="82" y="24" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">취산화서 (Cyme / 유한)</text>
    <text x="82" y="40" fill="#fca5a5" font-size="10" text-anchor="middle">★ 정단화 1번 먼저 개화!</text>
    <line x1="82" y1="80" x2="82" y2="125" stroke="#64748b" stroke-width="3"/>
    <!-- 정단화 (가장 큼, 1번) -->
    <line x1="82" y1="80" x2="82" y2="60" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="82" cy="55" r="7" fill="#f43f5e"/>
    <text x="82" y="58" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">1</text>
    <!-- 양측 측화 (2번) -->
    <line x1="82" y1="80" x2="45" y2="70" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="45" cy="70" r="5" fill="#fb7185"/>
    <text x="45" y="73" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">2</text>
    <line x1="82" y1="80" x2="119" y2="70" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="119" cy="70" r="5" fill="#fb7185"/>
    <text x="119" y="73" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">2</text>
    <text x="82" y="138" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">작약, 패랭이꽃, 덜꿩나무</text>
  </g>
</svg>