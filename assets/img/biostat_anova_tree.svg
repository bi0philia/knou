<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">📊 일원배치 분산분석(ANOVA) 총변량 분해와 F-검정 구조</text>
  
  <rect x="50" y="45" width="700" height="255" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 총제곱합 (SST) 상단 -->
  <g transform="translate(275, 65)">
    <rect width="250" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="125" y="26" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">총변량 / 총제곱합 (SST)</text>
    <text x="125" y="46" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">총자유도: df_T = N - 1</text>
  </g>

  <!-- 분해 분기 화살표 -->
  <path d="M350 125 L240 165" stroke="#64748b" stroke-width="2.5"/>
  <path d="M450 125 L560 165" stroke="#64748b" stroke-width="2.5"/>

  <!-- 처리제곱합 (SSt) 좌하단 -->
  <g transform="translate(100, 165)">
    <rect width="260" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="25" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">처리제곱합 (SSt / 집단간 변량)</text>
    <text x="130" y="45" fill="#a7f3d0" font-size="11" text-anchor="middle">처리자유도: df_t = k - 1</text>
    <rect x="20" y="55" width="220" height="28" rx="4" fill="#047857"/>
    <text x="130" y="74" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">처리평균제곱 MSt = SSt / (k - 1)</text>
  </g>

  <!-- 오차제곱합 (SSe) 우하단 -->
  <g transform="translate(440, 165)">
    <rect width="260" height="95" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="25" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">오차제곱합 (SSe / 집단내 변량)</text>
    <text x="130" y="45" fill="#fde68a" font-size="11" text-anchor="middle">오차자유도: df_e = N - k</text>
    <rect x="20" y="55" width="220" height="28" rx="4" fill="#78350f"/>
    <text x="130" y="74" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">오차평균제곱 MSe = SSe / (N - k)</text>
  </g>

  <!-- 최종 F 검정통계량 연결 -->
  <g transform="translate(300, 270)">
    <rect width="200" height="22" rx="4" fill="#0f172a" stroke="#f43f5e"/>
    <text x="100" y="16" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">★ 검정통계량: F = MSt / MSe</text>
  </g>
</svg>