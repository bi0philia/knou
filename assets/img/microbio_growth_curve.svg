<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">📈 회분식 배양(Batch Culture) 미생물 4단계 증식 곡선</text>
  
  <rect x="50" y="50" width="700" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 축 -->
  <line x1="120" y1="250" x2="700" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="250" x2="120" y2="80" stroke="#64748b" stroke-width="2"/>
  <text x="705" y="254" fill="#94a3b8" font-size="11">배양 시간 (Time)</text>
  <text x="120" y="70" fill="#94a3b8" font-size="11" text-anchor="middle">세포수 (log N)</text>

  <!-- 4구간 배경 분할 -->
  <rect x="120" y="80" width="100" height="170" fill="#38bdf8" fill-opacity="0.06"/>
  <rect x="220" y="80" width="160" height="170" fill="#10b981" fill-opacity="0.10"/>
  <rect x="380" y="80" width="160" height="170" fill="#f59e0b" fill-opacity="0.08"/>
  <rect x="540" y="80" width="150" height="170" fill="#f43f5e" fill-opacity="0.06"/>

  <line x1="220" y1="80" x2="220" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
  <line x1="380" y1="80" x2="380" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
  <line x1="540" y1="80" x2="540" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>

  <!-- 증식 곡선 -->
  <path d="M120 220 C170 220 210 218 220 215 C260 190 320 130 380 110 C440 110 490 110 540 112 C580 120 630 180 680 235" 
        fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <!-- 구간별 텍스트 주석 -->
  <!-- 1. 유도기 -->
  <g transform="translate(170, 95)">
    <text x="0" y="0" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">1. 유도기 (Lag)</text>
    <text x="0" y="16" fill="#94a3b8" font-size="10" text-anchor="middle">환경 적응, 효소 합성</text>
    <text x="0" y="28" fill="#94a3b8" font-size="10" text-anchor="middle">세포수 증가 없음</text>
  </g>

  <!-- 2. 대수기 -->
  <g transform="translate(300, 95)">
    <text x="0" y="0" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">2. 대수증식기 (Log)</text>
    <text x="0" y="16" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">최대 비증식속도 μ_max</text>
    <text x="0" y="28" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">★ 세대시간 측정 시기</text>
    <text x="0" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">세포 크기/생리 가장 균일</text>
  </g>

  <!-- 3. 정지기 -->
  <g transform="translate(460, 95)">
    <text x="0" y="0" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">3. 정지기 (Stationary)</text>
    <text x="0" y="16" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">증식속도 = 사멸속도</text>
    <text x="0" y="28" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">★ 항생물질(2차대사) 생산</text>
    <text x="0" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">내생포자 형성</text>
  </g>

  <!-- 4. 사멸기 -->
  <g transform="translate(615, 95)">
    <text x="0" y="0" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">4. 사멸기 (Death)</text>
    <text x="0" y="16" fill="#94a3b8" font-size="10" text-anchor="middle">사멸속도 > 증식속도</text>
    <text x="0" y="28" fill="#94a3b8" font-size="10" text-anchor="middle">독성 대사산물 축적</text>
    <text x="0" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">자가용해 진행</text>
  </g>
</svg>