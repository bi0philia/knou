<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">⚡ 세포내 공생 2대 에너지 소기관: 엽록체(광합성) vs 미토콘드리아(세포호흡)</text>
  
  <!-- 엽록체 (좌) -->
  <g transform="translate(60, 50)">
    <rect width="320" height="250" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="28" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">엽록체 (Chloroplast, 식물)</text>
    
    <!-- 엽록체 타원 모형 -->
    <ellipse cx="160" cy="95" rx="120" ry="50" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- 그라나/틸라코이드 기둥들 -->
    <g transform="translate(90, 80)">
      <ellipse cx="25" cy="0" rx="15" ry="4" fill="#34d399"/><ellipse cx="25" cy="7" rx="15" ry="4" fill="#34d399"/><ellipse cx="25" cy="14" rx="15" ry="4" fill="#34d399"/><ellipse cx="25" cy="21" rx="15" ry="4" fill="#34d399"/>
      <ellipse cx="70" cy="-5" rx="15" ry="4" fill="#34d399"/><ellipse cx="70" cy="2" rx="15" ry="4" fill="#34d399"/><ellipse cx="70" cy="9" rx="15" ry="4" fill="#34d399"/><ellipse cx="70" cy="16" rx="15" ry="4" fill="#34d399"/><ellipse cx="70" cy="23" rx="15" ry="4" fill="#34d399"/>
      <ellipse cx="115" cy="0" rx="15" ry="4" fill="#34d399"/><ellipse cx="115" cy="7" rx="15" ry="4" fill="#34d399"/><ellipse cx="115" cy="14" rx="15" ry="4" fill="#34d399"/><ellipse cx="115" cy="21" rx="15" ry="4" fill="#34d399"/>
    </g>

    <!-- 요약 3대 포인트 -->
    <g transform="translate(20, 165)">
      <text x="0" y="0" fill="#6ee7b7" font-size="11" font-weight="bold">• 명반응 (틸라코이드):</text>
      <text x="0" y="16" fill="#f8fafc" font-size="11">  물 광분해 → O₂ 방출, ATP·NADPH 생성</text>
      <text x="0" y="36" fill="#fde047" font-size="11" font-weight="bold">• 암반응/캘빈회로 (스트로마):</text>
      <text x="0" y="52" fill="#f8fafc" font-size="11">  Rubisco 효소가 CO₂ 고정 → 포도당 합성</text>
      <text x="0" y="72" fill="#94a3b8" font-size="10">• 2중막, 독자적 원형 DNA &amp; 70S 리보솜 보유</text>
    </g>
  </g>

  <!-- 미토콘드리아 (우) -->
  <g transform="translate(420, 50)">
    <rect width="320" height="250" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="28" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">미토콘드리아 (Mitochondria, 동식물)</text>
    
    <!-- 미토콘드리아 모형 (크리스테 내막) -->
    <ellipse cx="160" cy="95" rx="120" ry="50" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M60 95 C90 70 80 120 110 95 C140 70 130 120 160 95 C190 70 180 120 210 95 C240 70 230 120 260 95" 
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

    <!-- 요약 3대 포인트 -->
    <g transform="translate(20, 165)">
      <text x="0" y="0" fill="#fbbf24" font-size="11" font-weight="bold">• TCA 회로 (기질):</text>
      <text x="0" y="16" fill="#f8fafc" font-size="11">  피루브산 산화, CO₂ 방출, NADH·FADH₂ 생성</text>
      <text x="0" y="36" fill="#f43f5e" font-size="11" font-weight="bold">• 전자전달계/산화적인산화 (내막 크리스테):</text>
      <text x="0" y="52" fill="#f8fafc" font-size="11">  H⁺ 농도기울기로 ATP 다량 합성 (최종수용체 O₂)</text>
      <text x="0" y="72" fill="#94a3b8" font-size="10">• 2중막, 모계 유전(Maternal inheritance)</text>
    </g>
  </g>
</svg>