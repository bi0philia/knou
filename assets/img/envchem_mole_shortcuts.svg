<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="moleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="250" y="16" width="320" height="34" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="410" y="38" fill="#34d399" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡ 환경화학 시험장 1초 컷: [몰(Mole) 중심 변환 지도]</text>

  <!-- Central Mole Hub -->
  <circle cx="410" cy="180" r="62" fill="url(#moleGrad)" stroke="#6ee7b7" stroke-width="3" filter="drop-shadow(0 4px 12px rgba(16,185,129,0.35))"/>
  <text x="410" y="172" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" text-anchor="middle">몰수 (n)</text>
  <text x="410" y="195" fill="#d1fae5" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">[ 단위: mol ]</text>
  <text x="410" y="215" fill="#a7f3d0" font-family="'Pretendard', sans-serif" font-size="10" text-anchor="middle">모든 길은 몰로 통한다!</text>

  <!-- Node 1: Left - Mass (질량 g) -->
  <rect x="40" y="130" width="170" height="100" rx="12" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="125" y="160" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">질량 (w, g)</text>
  <text x="125" y="185" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">저울로 잰 실제 무게</text>
  <text x="125" y="210" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">예: 11 g, 4 g, 8 g</text>

  <!-- Arrow Left -> Center -->
  <line x1="210" y1="165" x2="338" y2="165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="232" y="145" width="85" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="274" y="159" fill="#7dd3fc" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">÷ 분자량(M)</text>

  <!-- Arrow Center -> Left -->
  <line x1="338" y1="195" x2="218" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="232" y="185" width="85" height="20" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="274" y="199" fill="#6ee7b7" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">× 분자량(M)</text>

  <!-- Node 2: Right - STP Volume (기체 부피 L) -->
  <rect x="610" y="130" width="170" height="100" rx="12" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="695" y="160" fill="#f59e0b" font-family="'Pretendard', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">STP 기체부피 (L)</text>
  <text x="695" y="185" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">0℃, 1기압 표준조건</text>
  <text x="695" y="210" fill="#fde68a" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5.6 L = 0.25 mol!</text>

  <!-- Arrow Center -> Right -->
  <line x1="482" y1="165" x2="600" y2="165" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <rect x="502" y="145" width="85" height="20" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="544" y="159" fill="#fde68a" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">× 22.4 L/mol</text>

  <!-- Arrow Right -> Center -->
  <line x1="600" y1="195" x2="482" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="502" y="185" width="85" height="20" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="544" y="199" fill="#6ee7b7" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">÷ 22.4 L/mol</text>

  <!-- Bottom Cheat-sheet Cards -->
  <!-- Box A: STP Fractions -->
  <g transform="translate(40, 275)">
    <rect width="230" height="120" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="28" rx="8" fill="#1e293b"/>
    <text x="115" y="19" fill="#fbbf24" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡ STP 부피 암기 세트</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• 22.4 L = <tspan fill="#34d399" font-weight="bold">1.00 mol</tspan></text>
    <text x="15" y="70" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• 11.2 L = <tspan fill="#34d399" font-weight="bold">0.50 mol</tspan> (1/2)</text>
    <text x="15" y="92" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">•  5.6 L = <tspan fill="#fbbf24" font-weight="bold">0.25 mol</tspan> (1/4)</text>
    <text x="15" y="112" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">•  2.24 L = <tspan fill="#38bdf8" font-weight="bold">0.10 mol</tspan> (1/10)</text>
  </g>

  <!-- Box B: Core Molecular Weights -->
  <g transform="translate(295, 275)">
    <rect width="230" height="120" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="28" rx="8" fill="#1e293b"/>
    <text x="115" y="19" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🎯 1초 컷 필수 분자량</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• CO₂ = <tspan fill="#f59e0b" font-weight="bold">44</tspan> (11g → 0.25mol)</text>
    <text x="15" y="70" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• CaCO₃ = <tspan fill="#34d399" font-weight="bold">100</tspan> (경도 계산)</text>
    <text x="15" y="92" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• NaOH = <tspan fill="#38bdf8" font-weight="bold">40</tspan> (4g → 0.1mol)</text>
    <text x="15" y="112" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• H₂O = 18 / O₂ = 32 / N₂ = 28</text>
  </g>

  <!-- Box C: Water &amp; Air Unit Conversions -->
  <g transform="translate(550, 275)">
    <rect width="230" height="120" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="28" rx="8" fill="#1e293b"/>
    <text x="115" y="19" fill="#a7f3d0" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🌊 환경 단위 환산 공식</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• 수질: <tspan fill="#34d399" font-weight="bold">1 ppm = 1 mg/L</tspan></text>
    <text x="15" y="70" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• 수질: <tspan fill="#38bdf8" font-weight="bold">1 ppb = 1 μg/L</tspan></text>
    <text x="15" y="92" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="12">• 백분율: <tspan fill="#fbbf24" font-weight="bold">1% = 10,000 ppm</tspan></text>
    <text x="15" y="112" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="11">• 대기: mg/m³ = ppm × (M / 22.4)</text>
  </g>
</svg>