<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">💡 베르-람베르트(Beer-Lambert) 흡광 법칙과 분광분석 원리</text>
  
  <rect x="50" y="45" width="700" height="235" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 광원 -->
  <g transform="translate(80, 110)">
    <circle cx="20" cy="40" r="15" fill="#facc15" stroke="#fef08a" stroke-width="2"/>
    <text x="20" y="70" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle">광원 (I₀)</text>
  </g>

  <!-- 입사광 빔 -->
  <line x1="120" y1="150" x2="280" y2="150" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
  <text x="200" y="140" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">입사광 강도 (I₀)</text>

  <!-- 큐벳 셀 (Cuvette) -->
  <g transform="translate(280, 80)">
    <rect width="80" height="140" rx="4" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="3"/>
    <!-- 흡수 분자 입자들 -->
    <circle cx="20" cy="30" r="4" fill="#38bdf8"/><circle cx="50" cy="40" r="4" fill="#38bdf8"/><circle cx="35" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="60" cy="90" r="4" fill="#38bdf8"/><circle cx="25" cy="110" r="4" fill="#38bdf8"/><circle cx="50" cy="120" r="4" fill="#38bdf8"/>
    <text x="40" y="15" fill="#bae6fd" font-size="10" font-weight="bold" text-anchor="middle">흡광용액(c)</text>
    <!-- 광로길이 b 표시 -->
    <line x1="0" y1="155" x2="80" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="40" y="170" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">광로길이 b (1 cm)</text>
  </g>

  <!-- 투과광 빔 (약해진 빛) -->
  <line x1="360" y1="150" x2="480" y2="150" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <text x="420" y="140" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">투과광 강도 (I)</text>

  <!-- 검출기 -->
  <g transform="translate(480, 100)">
    <rect width="40" height="100" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="20" y="118" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">검출기</text>
  </g>

  <!-- 우측 공식 및 법칙 박스 -->
  <g transform="translate(545, 70)">
    <rect width="185" height="185" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="92" y="26" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">베르-람베르트 공식</text>
    <rect x="15" y="38" width="155" height="35" rx="4" fill="#064e3b"/>
    <text x="92" y="61" fill="#ecfdf5" font-size="15" font-weight="bold" text-anchor="middle">A = ε · b · c</text>
    <g transform="translate(15, 90)">
      <text x="0" y="12" fill="#f8fafc" font-size="10">• **A**: 흡광도 (-log T)</text>
      <text x="0" y="28" fill="#f8fafc" font-size="10">• **T**: 투과율 (I / I₀)</text>
      <text x="0" y="44" fill="#f8fafc" font-size="10">• **ε**: 몰흡광계수</text>
      <text x="0" y="60" fill="#f8fafc" font-size="10">• **b**: 셀 두께 (cm)</text>
      <text x="0" y="76" fill="#34d399" font-size="10" font-weight="bold">• **c**: 용액 몰농도 (mol/L)</text>
    </g>
  </g>
</svg>