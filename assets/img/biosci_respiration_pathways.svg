<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:sans-serif;">
  <text x="400" y="28" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">⚡ 세포호흡 3단계(해당과정 → TCA회로 → 전자전달계)와 ATP 에너지 수지</text>
  
  <rect x="50" y="45" width="700" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- 1. 해당과정 -->
  <g transform="translate(80, 65)">
    <rect width="180" height="175" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">1. 해당과정 (Glycolysis)</text>
    <text x="90" y="45" fill="#94a3b8" font-size="11" text-anchor="middle">장소: 세포질 (Cytosol)</text>
    <rect x="15" y="60" width="150" height="45" rx="4" fill="#1e293b"/>
    <text x="90" y="78" fill="#f8fafc" font-size="10" text-anchor="middle">포도당(C₆) 1분자</text>
    <text x="90" y="94" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">↓ 피루브산(C₃) 2분자</text>
    <rect x="15" y="115" width="150" height="40" rx="4" fill="#0c4a6e"/>
    <text x="90" y="132" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">+ 2 ATP (기질수준)</text>
    <text x="90" y="148" fill="#bae6fd" font-size="11" text-anchor="middle">+ 2 NADH</text>
  </g>

  <!-- 화살표 -->
  <path d="M270 150 L295 150" stroke="#64748b" stroke-width="3"/>

  <!-- 2. TCA 회로 -->
  <g transform="translate(305, 65)">
    <rect width="190" height="175" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="95" y="25" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">2. TCA 회로 (시트르산)</text>
    <text x="95" y="45" fill="#94a3b8" font-size="11" text-anchor="middle">장소: 미토콘드리아 기질</text>
    <rect x="15" y="60" width="160" height="45" rx="4" fill="#1e293b"/>
    <text x="95" y="78" fill="#f8fafc" font-size="10" text-anchor="middle">아세틸-CoA 완전 산화</text>
    <text x="95" y="94" fill="#fde68a" font-size="10" text-anchor="middle">CO₂ 방출</text>
    <rect x="15" y="115" width="160" height="40" rx="4" fill="#78350f"/>
    <text x="95" y="132" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">+ 2 ATP (기질수준)</text>
    <text x="95" y="148" fill="#fef08a" font-size="11" text-anchor="middle">+ 6 NADH + 2 FADH₂</text>
  </g>

  <!-- 화살표 -->
  <path d="M505 150 L530 150" stroke="#64748b" stroke-width="3"/>

  <!-- 3. 전자전달계 -->
  <g transform="translate(540, 65)">
    <rect width="190" height="175" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="25" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">3. 산화적 인산화</text>
    <text x="95" y="45" fill="#a7f3d0" font-size="11" text-anchor="middle">장소: 미토콘드리아 내막</text>
    <rect x="15" y="60" width="160" height="45" rx="4" fill="#1e293b"/>
    <text x="95" y="78" fill="#f8fafc" font-size="10" text-anchor="middle">NADH, FADH₂ 산화</text>
    <text x="95" y="94" fill="#6ee7b7" font-size="10" text-anchor="middle">최종전자수용체: O₂ → H₂O</text>
    <rect x="15" y="115" width="160" height="40" rx="4" fill="#065f46"/>
    <text x="95" y="132" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">★ + 26~28 ATP</text>
    <text x="95" y="148" fill="#ecfdf5" font-size="10" text-anchor="middle">ATP 합성효소 회전</text>
  </g>

  <!-- 하단 총괄 수지 -->
  <text x="400" y="270" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">★ 포도당 1몰 완전 산화 시 이론적 총 에너지 생산: 30 ~ 32 ATP</text>
</svg>